name: firmware-binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-round:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Product config.h (no USB logs)
        run: |
          printf '%s\n' \
            '#pragma once' \
            '#ifndef SERIAL_DEBUG' \
            '#define SERIAL_DEBUG 0' \
            '#endif' > config.h

      - name: Compile and export binaries
        run: arduino-cli compile --profile xiao-s3 --export-binaries .

      - name: Stage installer names
        id: stage
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*#define FIRMWARE_VERSION "\([^"]*\)".*/\1/p' hue-round-switch.ino | tr -d '\r' | head -n1)
          if [ -z "$VERSION" ]; then
            echo "FIRMWARE_VERSION not found" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist/installer
          bootloader=$(find build -name 'hue-round-switch.ino.bootloader.bin' | head -n1)
          partitions=$(find build -name 'hue-round-switch.ino.partitions.bin' | head -n1)
          boot_app0=$(find build -name 'boot_app0.bin' | head -n1)
          firmware=$(find build -name 'hue-round-switch.ino.bin' | head -n1)
          test -n "$bootloader" -a -n "$partitions" -a -n "$boot_app0" -a -n "$firmware"
          cp "$bootloader" dist/installer/bootloader.bin
          cp "$partitions" dist/installer/partitions.bin
          cp "$boot_app0" dist/installer/boot_app0.bin
          cp "$firmware" dist/installer/firmware.bin
          ls -l dist/installer

      - name: Upload flash parts
        uses: actions/upload-artifact@v4
        with:
          name: hue-round-switch
          path: |
            dist/installer/bootloader.bin
            dist/installer/partitions.bin
            dist/installer/boot_app0.bin
            dist/installer/firmware.bin
          if-no-files-found: error

      - name: Upload to console
        env:
          FIRMWARE_UPLOAD_TOKEN: ${{ secrets.FIRMWARE_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FIRMWARE_UPLOAD_TOKEN:-}" ]; then
            echo "::error::FIRMWARE_UPLOAD_TOKEN missing; cannot upload the release to the console."
            exit 1
          fi
          # Credits: every core and library pinned in sketch.yaml must be listed in
          # THIRD_PARTY.json with the same version, so a bump cannot leave stale credits.
          python3 - <<'PY'
          import json, re, sys
          try:
              with open("THIRD_PARTY.json", encoding="utf-8") as f:
                  credits = json.load(f)
          except (OSError, ValueError) as e:
              print(f"::error::THIRD_PARTY.json is not valid JSON: {e}")
              sys.exit(1)
          if not isinstance(credits, list) or not all(isinstance(c, dict) for c in credits):
              print("::error::THIRD_PARTY.json must be a JSON array of objects.")
              sys.exit(1)
          listed = {c.get("name"): c.get("version") for c in credits}
          pins, section = [], None
          with open("sketch.yaml", encoding="utf-8") as f:
              for line in f:
                  s = line.split("#", 1)[0].rstrip()
                  item = re.match(r"^\s*-\s*(?:platform:\s*)?(.+?)\s*\(([^)]+)\)$", s)
                  key = re.match(r"^\s*([\w-]+):", s)
                  if item and section:
                      entry = f"{item.group(1)} ({item.group(2)})"
                      name = item.group(1)
                      if section == "platforms":
                          if name != "esp32:esp32":
                              print(f"::error::sketch.yaml platform '{entry}' has no THIRD_PARTY.json mapping.")
                              sys.exit(1)
                          name = "Arduino-ESP32 core"
                      pins.append((name, item.group(2), entry))
                  elif key and key.group(1) != "platform_index_url":
                      section = key.group(1) if key.group(1) in ("platforms", "libraries") else None
          if not pins:
              print("::error::No platforms or libraries found in sketch.yaml.")
              sys.exit(1)
          bad = False
          for name, version, entry in pins:
              if name not in listed:
                  print(f"::error::sketch.yaml pins '{entry}' but THIRD_PARTY.json has no entry named '{name}'.")
                  bad = True
              elif listed[name] != version:
                  print(f"::error::sketch.yaml pins '{entry}' but THIRD_PARTY.json lists '{name}' at version '{listed[name]}'.")
                  bad = True
          if bad:
              sys.exit(1)
          print("THIRD_PARTY.json covers sketch.yaml: " + ", ".join(e for _, _, e in pins))
          PY
          # Notes: the CHANGELOG.md section whose ### heading starts with VERSION,
          # up to the next ### or ## heading, HTML comments removed, blank edges trimmed.
          awk -v v="$VERSION" '
            /^#{2,3} / { if (f) exit; if (index($0, "### " v) == 1 && substr($0, length("### " v) + 1, 1) !~ /[0-9.]/) { f = 1; next } }
            f { print }
          ' CHANGELOG.md | tr -d '\r' \
            | sed -e 's/<!--.*-->//g' -e '/<!--/,/-->/d' \
            | sed -e '/[^[:space:]]/,$!d' \
            | sed -e ':a' -e '/^[[:space:]\n]*$/{$d;N;ba' -e '}' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No CHANGELOG.md entry for ${VERSION}. Add a '### ${VERSION} — YYYY-MM-DD' section in the commit that bumps FIRMWARE_VERSION."
            exit 1
          fi
          echo "Notes for ${VERSION}:"
          cat notes.md
          if ! code=$(curl -sS -o resp.json -w '%{http_code}' -X POST "https://hue.tineira.com/api/firmware/round" \
            -H "Authorization: Bearer $FIRMWARE_UPLOAD_TOKEN" \
            -F "version=$VERSION" \
            -F "commit=$GITHUB_SHA" \
            -F "notes=<notes.md" \
            -F "credits=<THIRD_PARTY.json" \
            -F "bootloader.bin=@dist/installer/bootloader.bin" \
            -F "partitions.bin=@dist/installer/partitions.bin" \
            -F "boot_app0.bin=@dist/installer/boot_app0.bin" \
            -F "firmware.bin=@dist/installer/firmware.bin"); then
            echo "::error::Console upload failed: curl could not complete the request."
            cat resp.json 2>/dev/null || true
            exit 1
          fi
          body=$(cat resp.json 2>/dev/null || true)
          echo "HTTP ${code}"
          echo "${body}"
          case "$code" in
            200|201) echo "Uploaded round ${VERSION} to the console." ;;
            409) echo "::warning::version_exists: round ${VERSION} bins are already released with different bytes; notes were updated. Bump FIRMWARE_VERSION to ship new bins." ;;
            *)
              echo "::error::Console upload returned HTTP ${code}: ${body}"
              exit 1
              ;;
          esac

      - name: Publish rolling usb-installer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=usb-installer
          TITLE="USB installer ${VERSION}"
          NOTES="Round Display product bins (${VERSION}). Four parts for hue.tineira.com; see docs/firmware-artifacts.md."
          FILES=(
            dist/installer/bootloader.bin
            dist/installer/partitions.bin
            dist/installer/boot_app0.bin
            dist/installer/firmware.bin
          )
          # Update in place. Deleting and re-creating the release let two quick
          # pushes race: one run deleted the release the other was uploading to.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes "$NOTES" --target "${GITHUB_SHA}"
          fi
